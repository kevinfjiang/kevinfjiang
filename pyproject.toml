[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kevinfjiang"
version = "0.1.0"
authors = [
    {name = "Kevin Jiang", email = "kevinfjiang@yahoo.com"},
]
description = "Personal github readme and website generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyYAML>=6.0",
    "typer>=0.9.0",
    "mdutils>=1.6.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "pytest>=7.0.0",
]


[project.urls]
"Source code" = "https://github.com/kevinfjiang/kevinfjiang"

[project.scripts]
update = "update.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["update"]

[tool.black]
line-length = 88

[tool.ruff]
select = ["E", "F", "I", "C90", "RUF"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403", "E501"]

[tool.ruff.isort]
known-first-party = ["update"]
known-third-party = [
    "mdutils",
    "requests",
    "typer",
    "yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]